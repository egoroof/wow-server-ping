name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build binaries
        run: |
          platforms=("linux/amd64" "windows/amd64" "darwin/amd64" "darwin/arm64")

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            NAME="wow-ping-${{ github.ref_name }}.${GOOS}-${GOARCH}"

            mkdir "$NAME"
            cp -r servers "$NAME/"
            cp *.md "$NAME/"

            if [ "$GOOS" = "windows" ]; then
              cp bat/*.bat "$NAME/"
            fi

            echo "Building wow-ping for $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w" \
              -o "$NAME/" \
              wow-ping.go

            echo "Building realmlist for $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w" \
              -o "$NAME/" \
              cmd/realmlist/realmlist.go

            zip -qr "${NAME}.zip" "$NAME"
          done
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: wow-ping-*.zip
