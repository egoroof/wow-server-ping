name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go build wow-ping.go
      - run: go build cmd/realmlist/realmlist.go
      - run: ./wow-ping -stats=1 -stats-interval=3.1s -ping-auth wowcircle
      - run: ./wow-ping -stats=1 -stats-interval=3.1s -ping-auth warmane
